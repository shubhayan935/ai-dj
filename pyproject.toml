[project]
name = "ai-dj"
version = "0.1.0"
description = "Data pipeline, DSP verifier, post-training, and evals for an AI DJ"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
ai-dj = "ai_dj.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dj"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
